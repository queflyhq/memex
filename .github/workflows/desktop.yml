name: Build desktop app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write   # to attach builds to the GitHub release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            artifact: memex-desktop-windows-amd64.exe
            wails-platform: windows/amd64
          - os: macos
            runs-on: macos-latest
            artifact: memex-desktop-macos-universal.app.zip
            wails-platform: darwin/universal
          - os: linux
            runs-on: ubuntu-latest
            artifact: memex-desktop-linux-amd64
            wails-platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend deps
        working-directory: desktop/frontend
        run: npm ci || npm install

      - name: Wails build
        working-directory: desktop
        run: wails build -platform ${{ matrix.wails-platform }} -clean

      - name: Package macOS app
        if: matrix.os == 'macos'
        working-directory: desktop/build/bin
        run: |
          # Wails emits memex-desktop.app on darwin
          ditto -c -k --keepParent memex-desktop.app ${{ matrix.artifact }}

      - name: Rename Windows artifact
        if: matrix.os == 'windows'
        shell: pwsh
        working-directory: desktop/build/bin
        run: |
          $exe = Get-ChildItem -Filter '*.exe' | Select-Object -First 1
          if ($exe) { Rename-Item $exe.FullName ${{ matrix.artifact }} }

      - name: Rename Linux artifact
        if: matrix.os == 'linux'
        working-directory: desktop/build/bin
        run: |
          bin=$(find . -maxdepth 1 -type f -executable -not -name '*.so*' | head -n1)
          if [ -n "$bin" ]; then mv "$bin" ${{ matrix.artifact }}; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/build/bin/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/bin/${{ matrix.artifact }}
          fail_on_unmatched_files: true
          # The desktop app is currently unsigned. Mac users will need to
          # right-click → Open the first time. Windows SmartScreen will
          # warn — code-signing certificates are tracked separately.
          body: |
            Desktop builds are unsigned in v1.0. Code signing is tracked under issue queflyhq/memex#TBD.
