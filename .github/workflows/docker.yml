name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign keyless signing

env:
  IMAGE: quefly/memex

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "creds_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "creds_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not set — skipping image publish. Add DOCKER_USERNAME and DOCKER_TOKEN to org or repo secrets to enable."
          fi

      - name: Set up QEMU (multi-arch)
        if: steps.check_creds.outputs.creds_present == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_creds.outputs.creds_present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_creds.outputs.creds_present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Compute image tags
        if: steps.check_creds.outputs.creds_present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        if: steps.check_creds.outputs.creds_present == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        if: steps.check_creds.outputs.creds_present == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign image (keyless via OIDC)
        if: steps.check_creds.outputs.creds_present == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign every tag we just pushed at the immutable digest. Keyless mode
          # — identity is the GitHub Actions OIDC token; no private keys.
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Install syft (SBOM generator)
        if: steps.check_creds.outputs.creds_present == 'true'
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Generate + attest SBOM (CycloneDX)
        if: steps.check_creds.outputs.creds_present == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE }}
        run: |
          # Generate a CycloneDX SBOM for the multi-arch image and attach it
          # as a cosign attestation at the digest.
          syft "${IMAGE_REF}@${DIGEST}" -o cyclonedx-json=sbom.cdx.json
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}@${DIGEST}"

      - uses: actions/upload-artifact@v4
        if: steps.check_creds.outputs.creds_present == 'true'
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
