[project]
name = "memex"
version = "1.0.2"
description = "Centralized agentic memory for any LLM/agent. MCP gateway + persistent graph + skill validation. Local-first, ships with a curated catalog of upstream MCP servers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Quefly", email = "team@quefly.com" }]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "memory",
    "ai",
    "agent",
    "knowledge-graph",
    "rag",
    "claude-code",
    "cursor",
    "windsurf",
    "cline",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "duckdb>=1.0",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "fastembed>=0.3",
    # ONNX runtime pinned to the last version that works with fastembed's
    # bge-small model. 1.20+ broke the SkipLayerNormalization op; until
    # fastembed releases a compatible build, we hold at 1.19.2. The
    # Windows wheels of this version need VC++ Redistributable installed
    # at the OS level — INSTALL.md covers it.
    "onnxruntime==1.19.2",
    # Codebase memory — typed-graph chunking via tree-sitter. The baseline
    # set covers AuthFI's full stack (Python, Go, JS/TS, Java for services;
    # Svelte/HCL/YAML/Bash for UI + infra) so memex works out of the box on
    # any project the user is likely to point it at. Add other languages
    # via the `code-<lang>` extras below.
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-bash>=0.23",
    "tree-sitter-yaml>=0.7",
    "tree-sitter-hcl>=1.1",
    "tree-sitter-svelte>=1.0",
    # Secrets vault — OS keychain backend so the AI layer never sees
    # literal secret values (memex returns `secret://provider/name`
    # handles; resolution happens at the boundary on demand).
    "keyring>=24",
    # System self-reporting (RAM/CPU/process info) for the desktop's
    # daemon-status footer. Cross-platform; lightweight.
    "psutil>=5.9",
    # DuckDB INTERVAL operations (e.g. `INTERVAL 24 HOUR` in our Home page
    # queries) need pytz at runtime. Without it, INTERVAL-using queries
    # crash with "Required module 'pytz' failed to import". Pin loose so
    # we don't fight any downstream tool.
    "pytz>=2024.1",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
# Fine-tuning extras — kept out of the default install (~3 GB) so the
# daemon stays light. Run scripts/train_lora.py with this extra to
# retrain memex on its own captured (query, useful-result) pairs.
finetune = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "optimum[onnxruntime]>=1.22",
    "onnx>=1.17",
]
# Additional code chunkers — opt-in for stacks beyond the baseline five.
code-rust = ["tree-sitter-rust>=0.23"]
code-cpp = ["tree-sitter-cpp>=0.23"]
code-csharp = ["tree-sitter-c-sharp>=0.23"]
code-ruby = ["tree-sitter-ruby>=0.23"]
all = [
    "fastembed>=0.3",
    "tree-sitter-rust>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
]

[project.scripts]
memex = "memex.frontends.cli.main:app"

[project.urls]
Homepage = "https://github.com/queflyhq/memex"
Repository = "https://github.com/queflyhq/memex"
Issues = "https://github.com/queflyhq/memex/issues"
Documentation = "https://github.com/queflyhq/memex/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build]
include = [
    "src/memex/**/*.py",
    "src/memex/**/*.json",
    "src/memex/**/*.jsonl",
    "src/memex/**/*.svg",
    # Web UI bundle — Jinja2 templates + CSS + vendored htmx/prism + editor logos.
    # Without these, the daemon ships but UI pages 404. They live under
    # src/memex/frontends/http/{templates,static}.
    "src/memex/**/*.html",
    "src/memex/**/*.css",
    "src/memex/**/*.js",
    "src/memex/**/*.png",
    # Skills + skill bundle metadata
    "src/memex/**/*.yaml",
    "src/memex/**/*.yml",
    "src/memex/**/*.md",
]

[tool.hatch.build.targets.sdist]
include = ["src/memex", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
