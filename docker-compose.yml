services:
  memex:
    image: quefly/memex:latest
    build: .
    container_name: memex
    restart: unless-stopped
    volumes:
      - ./memex-data:/data
    ports:
      # localhost-only by default. To expose, change to "0.0.0.0:7777:7777" AND
      # set MEMEX_AUTH_TOKEN — the daemon refuses non-localhost binding without auth.
      - "127.0.0.1:7777:7777"
    environment:
      MEMEX_DATA_DIR: /data
      MEMEX_LISTEN: 0.0.0.0:7777
      MEMEX_AUTH_TOKEN: ${MEMEX_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
