apiVersion: v1
kind: Service
metadata:
  name: {{ include "memex.fullname" . }}
  labels: {{- include "memex.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "memex.selectorLabels" . | nindent 4 }}
---
# Headless service for the StatefulSet — required for stable DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memex.fullname" . }}-headless
  labels: {{- include "memex.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "memex.selectorLabels" . | nindent 4 }}
